[project]
name = "silly-monte-carlo"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]
license = "MIT"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smc"]
